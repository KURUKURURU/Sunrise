<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunrise Project</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header></header>
    <main>
        <h1 class="title">Poster Inspiration Website</h1>
        <a href="https://www.marq.com/blog/poster-design-elements/" class="title_link">How can I make a good poster?</a>
        <h2>I want to make a good poster, and I made a website for it.</h2>

        <hr class="custom-line">
            
        <section class="parent-part">

            <div class="generator-title">
            <h2>Random Poster Style</h2>
            <p>Generate your poster's palette!</p>
            </div>

            <div class="parent-generator">
                <h2>Header Color</h2>
                <h3>Sub Color</h3>

                <p>Details Color</p>
                <button id="btn-random" class="medium-button">Create Random Style?</button>
            </div>

        </section>

        <hr class="custom-line">

        <div class="photo-gallery">
            <div class="gallery-item">
                <img src="img/example.jpg" alt="Example 1">
            </div>
            <div class="gallery-item">
                <img src="img/example1.jpg" alt="Example 2">
            </div>
            <div class="gallery-item">
                <img src="img/example2.jpg" alt="Example 3">
            </div>
        </div>
    </main>
    <footer>
        <hr>
        <p>Website created by Ava Bisset!!</p>
        <a href="https://avabisset.com/"><img src="img/logo.jpeg" alt="logo"></a>

    </footer>

</body>
<script src="script.js"></script>
</html>
